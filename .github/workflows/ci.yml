name: CI/CD — Tests, Build & Push Docker

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # user/mon-premier-cicd
  RENDER_APP_URL: https://ci-cd-1-sjcw.onrender.com   # URL publique service Render (option B : 1 service partagé staging+prod)

jobs:
  # ─── JOB 1 : Lint ─────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci
      - run: npm run lint

  # ─── JOB 2 : Tests ────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/

  # ─── JOB 3 : Build & Push Docker ──────────────────
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [ lint, test ]        # Attend lint ET test
    # Sur push branche main OU sur push de tag vX.Y.Z
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write              # Nécessaire pour pusher sur GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login sur GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name en lowercase (requis par GHCR)
        id: img
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Bonus 4.1 — tags semver en plus du SHA + latest
      - name: Extraire les métadonnées (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Bonus 4.2 — build local d'abord (pour scan Trivy), pas de push
      - name: Build (load local pour scan Trivy)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:scan
          format: table
          exit-code: '0'          # Rapport informationnel — ne bloque pas le push
          severity: CRITICAL,HIGH
          ignore-unfixed: true    # Ignore les vulns sans fix dispo

      # Build + push réel (depuis le cache, donc très rapide)
      - name: Build & Push l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── JOB 4 : Deploy STAGING (automatique) ─────────
  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: [ docker ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ env.RENDER_APP_URL }}

    steps:
      - name: Déclencher le déploiement Render via Deploy Hook
        run: |
          echo "::group::Trigger Render deploy"
          HTTP_CODE=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "HTTP $HTTP_CODE"
          cat /tmp/render_response.txt || true
          echo ""
          echo "::endgroup::"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ Deploy hook a renvoyé $HTTP_CODE"
            exit 1
          fi

      - name: Attendre la fin du déploiement Render
        run: |
          # Render ne renvoie pas d'ID de build via webhook → on poll /health
          echo "Attente du redémarrage de l'app (jusqu'à 5 min)…"
          for i in $(seq 1 30); do
            sleep 10
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.RENDER_APP_URL }}/health" || echo "000")
            echo "Try $i/30 — /health → $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ Service répond (200)"
              break
            fi
          done

      - name: Health check staging
        run: |
          echo "::group::Health check"
          RESP=$(curl -fsS "${{ env.RENDER_APP_URL }}/health")
          echo "$RESP"
          echo "::endgroup::"
          # Vérifie que la réponse contient bien "status":"ok"
          echo "$RESP" | grep -q '"status":"ok"' || { echo "❌ /health ne contient pas status:ok"; exit 1; }
          echo "✅ Staging health check OK"

      - name: Test endpoint /calc
        run: |
          RESP=$(curl -fsS "${{ env.RENDER_APP_URL }}/calc/add/5/3")
          echo "Réponse : $RESP"
          echo "$RESP" | grep -q '"result":8' || { echo "❌ /calc/add/5/3 ne retourne pas 8"; exit 1; }
          echo "✅ Endpoint /calc OK"

      - name: Step Summary staging
        if: always()
        run: |
          echo "## 🚀 Staging déployé" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL** : ${{ env.RENDER_APP_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Health check** : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ─── JOB 5 : Deploy PRODUCTION (approbation manuelle) ─────────
  deploy-production:
    name: 🏁 Deploy Production
    runs-on: ubuntu-latest
    needs: [ deploy-staging ]  # ← bloque prod si staging a échoué
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ env.RENDER_APP_URL }}

    steps:
      - name: Déclencher le déploiement Render via Deploy Hook
        run: |
          echo "::group::Trigger Render deploy"
          HTTP_CODE=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "HTTP $HTTP_CODE"
          cat /tmp/render_response.txt || true
          echo ""
          echo "::endgroup::"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ Deploy hook a renvoyé $HTTP_CODE"
            exit 1
          fi

      - name: Attendre la fin du déploiement Render
        run: |
          echo "Attente du redémarrage de l'app (jusqu'à 5 min)…"
          for i in $(seq 1 30); do
            sleep 10
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.RENDER_APP_URL }}/health" || echo "000")
            echo "Try $i/30 — /health → $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ Service répond (200)"
              break
            fi
          done

      - name: Health check production
        run: |
          echo "::group::Health check"
          RESP=$(curl -fsS "${{ env.RENDER_APP_URL }}/health")
          echo "$RESP"
          echo "::endgroup::"
          echo "$RESP" | grep -q '"status":"ok"' || { echo "❌ /health ne contient pas status:ok"; exit 1; }
          echo "✅ Production health check OK"

      - name: Step Summary production
        if: always()
        run: |
          echo "## 🏁 Production déployée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL** : ${{ env.RENDER_APP_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Health check** : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ─── JOB 6 : Notify (résumé global) ─────────
  notify:
    name: 📣 Notify
    runs-on: ubuntu-latest
    needs: [ lint, test, docker, deploy-staging, deploy-production ]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Résumé global dans le Step Summary
        run: |
          echo "## 📊 Pipeline complet — ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Étape | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Staging | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏁 Production | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL de l'app** : ${{ env.RENDER_APP_URL }}" >> $GITHUB_STEP_SUMMARY

      - name: Statut final
        run: |
          # Échoue si l'un des jobs en amont a échoué (le pipeline est rouge)
          if [ "${{ needs.lint.result }}" != "success" ] \
              || [ "${{ needs.test.result }}" != "success" ] \
              || [ "${{ needs.docker.result }}" != "success" ] \
              || [ "${{ needs.deploy-staging.result }}" != "success" ] \
              || [ "${{ needs.deploy-production.result }}" != "success" ]; then
            echo "❌ Pipeline en échec"
            exit 1
          fi
          echo "✅ Pipeline complet : tout est vert, prod déployée"
